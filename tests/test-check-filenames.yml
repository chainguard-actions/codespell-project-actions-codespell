name: Test check_filenames - misspelled filenames should cause failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run codespell with check_filenames enabled on committed fixture with misspelled filename
        uses: .
        with:
          path: tests/fixtures/filenames
          check_filenames: "1"
        continue-on-error: true

      - name: Assert codespell detected the misspelled filename and failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: codespell correctly detected the misspelled filename"
          else
            echo "FAIL: expected codespell to fail due to misspelled filename, but outcome was '$OUTCOME'"
            exit 1
          fi
