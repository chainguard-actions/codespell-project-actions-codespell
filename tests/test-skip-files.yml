name: Test skip input - skipped files should not cause failure
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run codespell skipping the committed fixture file with errors
        uses: .
        with:
          path: tests/fixtures/skip
          skip: "./.git,tests/fixtures/skip/bad.txt"

      - name: Assert codespell passed because the bad file was skipped
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: codespell correctly skipped the file with spelling errors"
          else
            echo "FAIL: expected codespell to pass with skipped files, but outcome was '$OUTCOME'"
            exit 1
          fi
