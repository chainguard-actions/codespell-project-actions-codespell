name: Test basic usage - no spelling errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        name: Run codespell on clean committed fixture files
        uses: .
        with:
          path: tests/fixtures/clean

      - name: Assert codespell passed with no errors
        run: |
          echo "PASS: codespell found no spelling errors in clean files"
